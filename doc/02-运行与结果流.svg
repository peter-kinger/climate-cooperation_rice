<text x="40.0" y="38.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="bold" fill="#25364b">02 / 从运行到评估绘图</text>
<text x="40.0" y="88.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">命令需在项目根目录执行；以下命令均使用 uv run python -m rllib_cpu.&lt;模块&gt;。</text>
<rect x="40.0" y="125.0" width="400.0" height="60.0" rx="10" fill="#fff5df" stroke="#c69a46" stroke-width="1.4" />
<text x="56.0" y="161.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">训练进程 / train</text>
<rect x="520.0" y="125.0" width="400.0" height="60.0" rx="10" fill="#fff5df" stroke="#c69a46" stroke-width="1.4" />
<text x="536.0" y="161.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">独立加载进程 / evaluate</text>
<rect x="1000.0" y="125.0" width="400.0" height="60.0" rx="10" fill="#fff5df" stroke="#c69a46" stroke-width="1.4" />
<text x="1016.0" y="161.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">结果分析进程 / plot</text>
<rect x="40.0" y="235.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="56.0" y="269.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">train.main()</text>
<text x="56.0" y="293.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">读取 configs/cpu.yaml 与 CLI 覆盖项</text>
<text x="56.0" y="317.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">创建全新的 runs/&lt;实验名&gt; 目录</text>
<rect x="40.0" y="405.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="56.0" y="439.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">runtime.setup() + build()</text>
<text x="56.0" y="463.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">启动 CPU Ray；注册 RiceEnv / 模型</text>
<text x="56.0" y="487.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">共享 regions 策略；GPU 数量 = 0</text>
<rect x="40.0" y="575.0" width="400.0" height="130.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="56.0" y="610.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">algo.train()：循环 iterations 次</text>
<text x="56.0" y="634.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">观察 → 共享策略动作 → env.step()</text>
<text x="56.0" y="658.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">采样批量 → PPO 更新参数</text>
<text x="56.0" y="682.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">写入 training.csv</text>
<rect x="40.0" y="775.0" width="400.0" height="105.0" rx="10" fill="#eaf7ef" stroke="#62a37c" stroke-width="1.4" />
<text x="56.0" y="809.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">algo.save()</text>
<text x="56.0" y="833.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">保存完整 checkpoint/</text>
<text x="56.0" y="857.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">保存实际 config.yaml 与路径提示</text>
<rect x="40.0" y="945.0" width="400.0" height="90.0" rx="10" fill="#fff5df" stroke="#c69a46" stroke-width="1.4" />
<text x="56.0" y="984.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">finally</text>
<text x="56.0" y="1008.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">algo.stop()；ray.shutdown()</text>
<rect x="520.0" y="235.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="536.0" y="269.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">evaluate.main()</text>
<text x="536.0" y="293.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">读取 runs/&lt;实验名&gt;/config.yaml</text>
<text x="536.0" y="317.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">setup() 注册环境和模型</text>
<rect x="520.0" y="405.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="536.0" y="439.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">Algorithm.from_checkpoint()</text>
<text x="536.0" y="463.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">从 runs/&lt;实验名&gt;/checkpoint 恢复</text>
<text x="536.0" y="487.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">不更新策略参数</text>
<rect x="520.0" y="575.0" width="400.0" height="130.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="536.0" y="610.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">每个评估回合</text>
<text x="536.0" y="634.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">RiceEnv.reset() → compute_single_action()</text>
<text x="536.0" y="658.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">→ RiceEnv.step() → 直到 terminated</text>
<text x="536.0" y="682.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">默认 explore=False；可加 --explore</text>
<rect x="520.0" y="775.0" width="400.0" height="130.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="536.0" y="810.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">提取 global_state；检查有限数值</text>
<text x="536.0" y="834.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">原始轨迹：trajectory_*.npz</text>
<text x="536.0" y="858.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">按 activity_timestep 筛出经济年份</text>
<text x="536.0" y="882.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">谈判中间步骤不当作新增年份</text>
<rect x="520.0" y="975.0" width="400.0" height="105.0" rx="10" fill="#eaf7ef" stroke="#62a37c" stroke-width="1.4" />
<text x="536.0" y="1009.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">导出评估结果；关闭算法和 Ray</text>
<text x="536.0" y="1033.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">evaluation.csv：全球年度结果</text>
<text x="536.0" y="1057.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">regions.csv；summary.json</text>
<rect x="1000.0" y="235.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="1016.0" y="269.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">plot.main()</text>
<text x="1016.0" y="293.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">读取 evaluation.csv</text>
<text x="1016.0" y="317.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">按年份聚合并绘制全球六面板</text>
<rect x="1000.0" y="405.0" width="400.0" height="105.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="1016.0" y="439.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">读取 regions.csv</text>
<text x="1016.0" y="463.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">按地区 / 年份聚合</text>
<text x="1016.0" y="487.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">绘制各地区减排曲线</text>
<rect x="1000.0" y="575.0" width="400.0" height="130.0" rx="10" fill="#eef4ff" stroke="#6385bd" stroke-width="1.4" />
<text x="1016.0" y="622.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">读取 training.csv</text>
<text x="1016.0" y="646.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">绘制平均回合奖励曲线</text>
<text x="1016.0" y="670.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">只有一次迭代时，仅有一个训练点</text>
<rect x="1000.0" y="775.0" width="400.0" height="130.0" rx="10" fill="#eaf7ef" stroke="#62a37c" stroke-width="1.4" />
<text x="1016.0" y="810.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">三张 PNG</text>
<text x="1016.0" y="834.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">analysis.png</text>
<text x="1016.0" y="858.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">regional_mitigation.png</text>
<text x="1016.0" y="882.0" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">training.png</text>
<rect x="40.0" y="1140.0" width="1360.0" height="145.0" rx="10" fill="#f4f2f8" stroke="#9a8fb0" stroke-width="1.4" />
<text x="56.0" y="1170.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="bold" fill="#25364b">逐步运行：</text>
<text x="56.0" y="1194.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">uv run python -m rllib_cpu.train --iterations 1 --output runs/my-run</text>
<text x="56.0" y="1218.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">uv run python -m rllib_cpu.evaluate --run runs/my-run --episodes 1</text>
<text x="56.0" y="1242.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">uv run python -m rllib_cpu.plot --run runs/my-run</text>
<text x="56.0" y="1266.5" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="normal" fill="#25364b">一键运行：powershell -ExecutionPolicy Bypass -File .\run_all.ps1 -RunDir runs/my-run -Iterations 1</text>
<text x="40" y="1348" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="normal" fill="#25364b">蓝：代码 / 函数    绿：参数 / 结果    黄：执行步骤    紫：说明    箭头：调用或数据流</text>
</svg>